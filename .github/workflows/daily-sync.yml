name: Daily sync (TrueNAS)

# Replaces the Nelnet + EdFinancial blocks in monarch-sync-daily.sh.
#
# This repo (shmuelsash's fork of mattebad/monarch-studentaid-sync) is deployed
# TWICE on TrueNAS — once per person — each in its own dir with its own .env:
#   nelnet-sync-shmuel      (Nelnet / Shmuel)
#   edfinancial-sync-shana  (EdFinancial / Shana)
#
# One workflow drives both via a matrix, on this repo's dedicated self-hosted
# runner. The deployed dirs track UPSTREAM mattebad/main (public — no credential
# needed for the code pull). Secrets stay in each dir's .env on the box and are
# never sent to GitHub.
# ── CHANGING WHICH BRANCH A JOB RUNS ────────────────────────────────────────────
# The deployed code is picked per person by `ref` in the matrix below:
#   origin/main         -> mattebad's upstream (the normal state)
#   fork/<branch-name>  -> a branch on YOUR fork (shmuelsash)
# Two ways to switch (e.g. to run your own PR branch until it merges upstream):
#   1. PERSISTENT (every daily run): edit the person's `ref:` in the matrix and
#      commit; change it back to "origin/main" once your PR merges upstream.
#   2. ONE-OFF (a single manual run): Actions -> Daily sync -> "Run workflow",
#      type a ref in that person's box. Blank = use the matrix default.
# ────────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # 14:00 UTC, staggered after grocery (13:30) and optum (13:45) so the syncs
    # don't overlap on the box. GitHub cron is UTC-only and may lag a few minutes.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      nelnet_ref:
        description: "Nelnet: git ref for THIS run only (blank = matrix default). e.g. fork/my-branch"
        required: false
        default: ""
      edfinancial_ref:
        description: "EdFinancial: git ref for THIS run only (blank = matrix default). e.g. fork/my-branch"
        required: false
        default: ""

concurrency:
  group: studentaid-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: self-hosted
    name: ${{ matrix.person.name }}
    strategy:
      max-parallel: 1   # single runner; also avoids two Monarch logins at once
      fail-fast: false  # one person's failure must not cancel the other
      matrix:
        person:
          - { name: "Nelnet (Shmuel)", dir: nelnet-sync-shmuel, ref: "origin/main", safe: nelnet }
          # TEMP PIN: run the modal-fix branch until mattebad/monarch-studentaid-sync#18
          # merges upstream, then change this back to "origin/main".
          - {
              name: "EdFinancial (Shana)",
              dir: edfinancial-sync-shana,
              ref: "fork/fix/edfinancial-cookieyes-modals",
              safe: edfinancial,
            }
    permissions:
      contents: read
    env:
      MS: /mnt/main_server/homelab-apps/monarch-sync
      DIR: /mnt/main_server/homelab-apps/monarch-sync/monarch-studentaid-sync/${{ matrix.person.dir }}
      DEFAULT_REF: ${{ matrix.person.ref }}
      # One-off override typed in the "Run workflow" dialog (empty on scheduled runs).
      OVERRIDE_REF: ${{ (matrix.person.safe == 'nelnet' && inputs.nelnet_ref) || (matrix.person.safe == 'edfinancial' && inputs.edfinancial_ref) || '' }}
      SAFE: ${{ matrix.person.safe }}
    steps:
      - name: Update deployed code (default = matrix ref; a manual-run override wins)
        run: |
          REF="${OVERRIDE_REF:-$DEFAULT_REF}"
          echo "Deploying $SAFE at ref: $REF"
          git config --global --add safe.directory "$DIR"
          cd "$DIR"
          git fetch --all --prune
          git reset --hard "$REF"

      - name: Verify config + encrypted secret safe are present on the box
        run: |
          cd "$DIR"
          test -f .env || { echo "::error::.env missing in $DIR (non-secret config)"; exit 1; }
          test -f "$MS/secrets/$SAFE/secrets.enc" \
            || { echo "::error::secret safe missing for '$SAFE' -- set it in the dashboard (Sync -> Credentials)"; exit 1; }

      - name: Build image on the box
        run: |
          cd "$DIR"
          sudo docker compose build

      - name: Run sync (secrets decrypted from the safe into the container -- never on disk)
        # The upstream app reads its secrets from the environment as usual; this wrapper
        # decrypts the per-job safe and forwards the values via `docker compose run -e`,
        # so no secrets logic has to live in the (upstream-tracked) app code.
        run: |
          cd "$DIR"
          sudo python3 "$MS/run-with-secrets.py" "$SAFE" -- docker compose run --rm studentaid-monarch-sync
