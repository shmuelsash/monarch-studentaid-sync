name: Daily sync (TrueNAS)

# Replaces the Nelnet + EdFinancial blocks in monarch-sync-daily.sh.
#
# This repo (shmuelsash's fork of mattebad/monarch-studentaid-sync) is deployed
# TWICE on TrueNAS — once per person — each in its own dir with its own .env:
#   nelnet-sync-shmuel      (Nelnet / Shmuel)
#   edfinancial-sync-shana  (EdFinancial / Shana)
#
# One workflow drives both via a matrix, on this repo's dedicated self-hosted
# runner. The deployed dirs track UPSTREAM mattebad/main (public — no credential
# needed for the code pull). Secrets stay in each dir's .env on the box and are
# never sent to GitHub.
# ── CHANGING WHICH BRANCH A JOB RUNS ────────────────────────────────────────────
# The deployed code is picked per person by `ref` in the matrix below:
#   origin/main         -> mattebad's upstream (the normal state)
#   fork/<branch-name>  -> a branch on YOUR fork (shmuelsash)
# The deploy picks the ref in this order:
#   1. A ref typed in "Run workflow" (this run only) -> overrides everything.
#   2. The branch chosen in the DASHBOARD (Sync page dropdown), saved to
#      monarch-sync/secrets/<job>/ref -> the easy, no-YAML way to run your PR
#      branch until it merges upstream. This is the normal way to switch.
#   3. The matrix `ref:` default below -> the fallback if 1 and 2 are unset.
# ────────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # 14:00 UTC, staggered after grocery (13:30) and optum (13:45) so the syncs
    # don't overlap on the box. GitHub cron is UTC-only and may lag a few minutes.
    - cron: "0 14 * * *"
    # Second pass ~8h later. On 2026-09-07 both servicers were refused at the
    # TCP layer (net::ERR_CONNECTION_REFUSED to nelnet/edfinancial.studentaid.gov,
    # adjacent IPs in one Akamai /24) and the whole day was lost. The in-job retry
    # below tops out at ~6min of waiting -- far too short to outlast an egress
    # block, which is this pass's job. It stands down when the day already
    # succeeded, so a good day costs nothing.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      nelnet_ref:
        description: "Nelnet: git ref for THIS run only (blank = matrix default). e.g. fork/my-branch"
        required: false
        default: ""
      edfinancial_ref:
        description: "EdFinancial: git ref for THIS run only (blank = matrix default). e.g. fork/my-branch"
        required: false
        default: ""

concurrency:
  group: studentaid-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: self-hosted
    name: ${{ matrix.person.name }}
    strategy:
      max-parallel: 1   # single runner; also avoids two Monarch logins at once
      fail-fast: false  # one person's failure must not cancel the other
      matrix:
        person:
          - { name: "Nelnet (Shmuel)", dir: nelnet-sync-shmuel, ref: "origin/main", safe: nelnet }
          # TEMP PIN: run the modal-fix branch until mattebad/monarch-studentaid-sync#18
          # merges upstream, then change this back to "origin/main".
          - {
              name: "EdFinancial (Shana)",
              dir: edfinancial-sync-shana,
              ref: "fork/fix/edfinancial-cookieyes-modals",
              safe: edfinancial,
            }
    permissions:
      contents: read
    env:
      MS: /mnt/main_server/homelab-apps/monarch-sync
      DIR: /mnt/main_server/homelab-apps/monarch-sync/monarch-studentaid-sync/${{ matrix.person.dir }}
      DEFAULT_REF: ${{ matrix.person.ref }}
      # One-off override typed in the "Run workflow" dialog (empty on scheduled runs).
      OVERRIDE_REF: ${{ (matrix.person.safe == 'nelnet' && inputs.nelnet_ref) || (matrix.person.safe == 'edfinancial' && inputs.edfinancial_ref) || '' }}
      SAFE: ${{ matrix.person.safe }}
    steps:
      # Repeating a day's work is not free: another servicer login, another
      # chance to trip a portal's bot detection. The evening pass exists only to
      # rescue a failed morning, and each person is tracked separately since the
      # matrix can fail one and not the other. Manual runs always proceed.
      - name: Skip if already synced today
        id: guard
        run: |
          state="$MS/.last-sync-success-$SAFE"
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "$state" ]; then
            last=$(cat "$state" 2>/dev/null || echo 0)
            case "$last" in ''|*[!0-9]*) last=0 ;; esac
            age=$(( $(date -u +%s) - last ))
            if [ "$last" -gt 0 ] && [ "$age" -lt 72000 ]; then
              echo "$SAFE: last success $(( age / 3600 ))h ago (under 20h) — standing down."
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Update deployed code (order = manual override, then dashboard pick, then matrix default)
        if: steps.guard.outputs.skip != 'true'
        run: |
          # 1) a ref typed in the "Run workflow" box (this run only)
          REF="$OVERRIDE_REF"
          # 2) else the branch chosen in the dashboard (Sync page), saved to <job>/ref
          if [ -z "$REF" ] && [ -f "$MS/secrets/$SAFE/ref" ]; then
            REF="$(cat "$MS/secrets/$SAFE/ref")"
          fi
          # 3) else the matrix default below
          REF="${REF:-$DEFAULT_REF}"
          echo "Deploying $SAFE at ref: $REF"
          git config --global --add safe.directory "$DIR"
          cd "$DIR"
          git fetch --all --prune
          git reset --hard "$REF"

      - name: Verify config + encrypted secret safe are present on the box
        if: steps.guard.outputs.skip != 'true'
        run: |
          cd "$DIR"
          test -f .env || { echo "::error::.env missing in $DIR (non-secret config)"; exit 1; }
          test -f "$MS/secrets/$SAFE/secrets.enc" \
            || { echo "::error::secret safe missing for '$SAFE' -- set it in the dashboard (Sync -> Credentials)"; exit 1; }

      - name: Build image on the box
        if: steps.guard.outputs.skip != 'true'
        run: |
          cd "$DIR"
          sudo docker compose build

      - name: Run sync (secrets decrypted from the safe into the container -- never on disk)
        if: steps.guard.outputs.skip != 'true'
        # The upstream app reads its secrets from the environment as usual; this wrapper
        # decrypts the per-job safe and forwards the values via `docker compose run -e`,
        # so no secrets logic has to live in the (upstream-tracked) app code.
        #
        # Retried here (deploy layer) rather than in-app: the portal login occasionally
        # flakes on a transient page-render hiccup (e.g. a "Sign in" button not ready
        # yet) that a plain rerun clears right up. Adding retry logic to src/ would mean
        # diverging from upstream -- see DEPLOY.md.
        run: |
          set -o pipefail
          cd "$DIR"

          # Mirror of the job log (which anyone who can read the run already sees), kept
          # only for the life of the step so nothing lands on the box.
          out="$(mktemp)"
          trap 'rm -f "$out"' EXIT

          # A rejected credential is not a flake: it fails identically every time, and
          # each extra attempt is one closer to the lockout the app itself warns about
          # ("account may be locked or you are out of attempts"). On 2026-09-15 the
          # evening Nelnet pass spent both attempts, 60s apart, on a password Monarch
          # had already refused outright.
          fatal='Invalid email and password combination|LoginFailedException|rejected your User ID / Password|credentials are invalid/incorrect|account may be locked'

          attempts=3
          for i in $(seq 1 "$attempts"); do
            if sudo python3 "$MS/run-with-secrets.py" "$SAFE" -- \
                 docker compose run --rm studentaid-monarch-sync 2>&1 | tee "$out"; then
              exit 0
            fi

            if grep -qE "$fatal" "$out"; then
              echo "::error::$SAFE: a login was rejected outright, so this is not a flake -- stopping after attempt $i rather than risking a lockout. Refresh this job's credentials in the dashboard (Sync -> Credentials), then rerun."
              exit 1
            fi

            if [ "$i" -lt "$attempts" ]; then
              # 60s clears a render hiccup; 300s can also outlast a brief egress blip.
              # Anything longer is the evening pass's job, not this loop's.
              delay=$(( i == 1 ? 60 : 300 ))
              echo "::warning::Sync attempt $i/$attempts failed (possible transient portal flake); retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "::error::Sync failed after $attempts attempts."
          exit 1

      - name: Record success
        if: success() && steps.guard.outputs.skip != 'true'
        run: date -u +%s > "$MS/.last-sync-success-$SAFE"

      # A network failure logs only "connection refused" -- not which address, and not
      # whether something on our own network refused it. That gap turned 2026-09-07 into
      # a manual firewall hunt. The probe added to close it never actually closed it:
      # see the servicer-host note below.
      - name: Network diagnostics (on failure)
        if: failure()
        run: |
          cd "$DIR"

          envget() {
            grep -E "^$1=" .env 2>/dev/null | head -1 | cut -d= -f2- | tr -d "\"' " || true
          }

          # The deployed .env sets SERVICER_PROVIDER, not SERVICER_BASE_URL: config.py
          # derives https://<provider>.studentaid.gov whenever the URL is absent, and
          # env.example does not even list SERVICER_BASE_URL. Reading only the URL left
          # $servicer empty, so the probe silently dropped the one host it was added to
          # check -- every failure log from 2026-09-13 on named Monarch, Gmail and MCR
          # and never the servicer that had just refused the connection. Mirror the same
          # order config.py uses.
          url="$(envget SERVICER_BASE_URL)"
          if [ -z "$url" ]; then
            provider="$(envget SERVICER_PROVIDER)"
            if [ -n "$provider" ]; then
              url="https://$provider.studentaid.gov"
            fi
          fi
          servicer=$(printf '%s' "$url" | sed -E 's#^[a-zA-Z]+://##; s#[/:].*##')

          # Ports the app actually connects on. Gmail was probed on 443, which Google
          # does not serve there -- imaplib uses 993 -- so every failure log carried a
          # standing false "REFUSED" for Gmail sitting next to the real fault.
          targets="app.monarchmoney.com:443 imap.gmail.com:993 mcr.microsoft.com:443"
          if [ -n "$servicer" ]; then
            targets="$servicer:443 $targets"
          else
            echo "::warning::Could not read the servicer host from $DIR/.env (neither SERVICER_BASE_URL nor SERVICER_PROVIDER is set); probing shared dependencies only."
          fi

          echo "Probed from $(hostname) at $(date -u +%FT%TZ) for '$SAFE'"
          echo "== from the host =="
          for target in $targets; do
            host="${target%:*}"
            port="${target##*:}"
            echo "-- $host:$port"
            ips=$(getent ahostsv4 "$host" 2>/dev/null | awk '{print $1}' | sort -u)
            if [ -z "$ips" ]; then
              echo "   DNS: no A record — resolution itself failed"
              continue
            fi
            for ip in $ips; do
              if timeout 5 bash -c "exec 3<>/dev/tcp/$ip/$port" 2>/dev/null; then
                echo "   $ip:$port  reachable"
              else
                echo "   $ip:$port  REFUSED or unreachable"
              fi
            done
          done

          # The sync runs in a container on the compose bridge network, and that is where
          # the ERR_CONNECTION_REFUSED came from -- a host-side "all reachable" says
          # nothing about it. DEPLOY.md already notes that leftover bridge networks cause
          # intermittent container networking failures; this is how we would see one.
          # The entrypoint is overridden, so the app never runs and no secrets are passed.
          # (The python below sits at this block's base indent on purpose: YAML strips
          # exactly that much, so it reaches the interpreter at column 0. Indenting it
          # any deeper is an IndentationError; any shallower ends the block scalar.)
          echo "== from inside the container (compose network) =="
          timeout 180 sudo docker compose run --rm --no-deps -T \
            --entrypoint python3 studentaid-monarch-sync -c '
          import socket, sys
          for t in sys.argv[1:]:
              host, port = t.rsplit(":", 1)
              port = int(port)
              print(f"-- {host}:{port}")
              try:
                  ips = sorted({ai[4][0] for ai in socket.getaddrinfo(host, port, socket.AF_INET, socket.SOCK_STREAM)})
              except OSError as e:
                  print(f"   DNS: resolution itself failed ({e})")
                  continue
              for ip in ips:
                  s = socket.socket()
                  s.settimeout(5)
                  try:
                      s.connect((ip, port))
                      print(f"   {ip}:{port}  reachable")
                  except OSError as e:
                      print(f"   {ip}:{port}  {e.strerror or e}")
                  finally:
                      s.close()
          ' $targets || echo "   (in-container probe did not run)"

          # A diagnostic must never mask the failure it describes.
          exit 0

      # `compose run --rm` only removes the container; the project's bridge
      # network is left behind on every run. Tear it down here (always, even
      # on failure) so it doesn't pile up alongside the other sync jobs' networks.
      - name: Remove the compose network
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          cd "$DIR"
          sudo docker compose down --remove-orphans
